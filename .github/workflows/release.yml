name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Only the repository owner can initiate publication.
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a commit merged into main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify release tag and official SDK version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          upstream=$(ruby -r ./lib/typesafe/sdk/version -e 'print Typesafe::SDK::UPSTREAM_VERSION')
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/typesafe-ai/typesafe-sdk-js/v${upstream}/package.json" -o /tmp/upstream-package.json
          ruby script/check_release.rb /tmp/upstream-package.json
      - name: Run specs and linter
        run: bundle exec rake
      - name: Build gem
        run: gem build typesafe-sdk-ruby.gemspec --strict
      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: gem push typesafe-sdk-ruby-*.gem
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: typesafe-sdk-ruby-*.gem
